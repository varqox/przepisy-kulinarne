# Tiramisu
Przeskaluj przepis: $scale 4/4$ \
Tryb prezentacji: $present$

Kalorie: całość $całość_kcal = 3538 kcal$ = 310 kcal / 100g.
~
## Składniki
- $kawa_szklanka = 0.8$ szklanki bardzo mocnej świeżej kawy = $kawa_g = 220g$ (np. z $kawa_łyżeczki = 2 łyżeczek$ kawy mielonej)
- $biszkopty_opakowanie = 1 opakowanie$ biszkoptów = $biszkopty_g = 220g$
- $jajka = 4$ jajka L w temp. pokojowej
- $cukier_g = 70g$ cukru = $cukier_szklanka = 0.32 szklanki$ (szklanka 250 ml to 220 g cukru)
- $mascarpone_g = 500g$ serka mascarpone, schłodzonego
- dobre mielone kakao (parę łyżeczek) do posypania (np. DecoMorreno) lub mocno gorzka czekolada starta na drobnych oczkach (ale kakao jest lepsze)
- odrobina mielonej wanilii lub ekstraktu z wanilii

~
## Przepis
~- Zaparz $kawa_szklanka$ szklanki kawy (= $kawa_g$) z ok. $kawa_łyżeczki$. Przestudź.
~
### Krem
~- Przygotuj dwie miski: średnią i dużą
~- Rozdziel białka do średniej, a żółtka do dużej miski z $jajka$ jajek
~- Białka ubij lekko ze szczyptą soli. Ubijaj dalej dodając stopinowo (po łyżce / dwóch łyżkach) połowę (= $cukier_g / 2$ = $cukier_szklanka / 2$) cukru aż cały się rozpuści.
~- Ubij żółtka z drugą połową (= $cukier_g / 2$ = $cukier_szklanka / 2$) cukru i szczyptą wanilii (aż będą mega puszyste i cukier się rozpuści).
~- Najlepiej użyj rózgi: dodawaj stopniowo serek mascarpone (= $mascarpone_g$), Najpierw łyżka, potem 2, potem reszta i wyrób na gładką masę.
~- Dodaj pianę z białek do reszty masy i delikatnie ale dokładnie wymieszaj. Lepiej rózgą, miksera nie polecam.
~
### Układanie w naczyniu
~- Przygotuje naczynie na tiramisu.
~- Przygotuj głęboki talerz do namaczania biszkoptów
~- Wlej tam połowę kawy = $ kawa_szklanka / 2$ szklanki (= $kawa_g / 2$).
~- Połowę biszkoptów, krótko i pojedynczo namaczaj i układaj na spodzie naczynia.
~- Biszkopty posyp lekko kakao.
~- Wylej na to połowę kremu i wyrównaj.
~- Wlej resztę kawy do głębokiego talerza i powtórz namaczanie oraz układanie.
~- Polej kremem (tym razem bez kakao!) i wyrównaj.
~- Wierzch posyp grubszą warstwą kakao, ale tylko tyle żeby krem nie prześwitywał.
~- Włóż do lodówki na kilka godzin np. na noc. Smakuje najlepiej na drugi dzień.
~- Smacznego!

~~

## Eksperymenty

### 1. 2/4 porcji i 60g kawy zamiast 120g
Biszkopty mało namoknięte, miejscami wręcz jeszcze kruche po kilku godzinach. Na drugi dzień przemokły bardziej równomiernie i było pycha, ale i tak dałbym trochę więcej kawy.

### 2. 2/4 porcji i 90g kawy zamiast 120g
Biszkopty były średnio namoknięte, miejscami wręcz jeszcze kruche po kilku godzinach. Na drugi dzień przemokły równomiernie i było pycha. Dałbym ciut więcej kawy.

### 3. 2/4 porcji i 40g cukru i 110g kawy
Troszkę za słodkie wyszło, namoknięcie git.
Zmieniam w przepisie: cukier 40g -> 35g i kawę 100g -> 110g.
