# Pesto z bazylii
Przeskaluj przepis (ilość bazylii): $scale 70 / 70 hide_denom$ g \
Tryb prezentacji: $present$
~

## Składniki
- $czosnek_ząbki = 2 ząbki$ czosnku = $czosnek_g = 4g$
- $sól_g = 0.75g$ soli
- $orzechy_g = 22g$ orzechów nerkowca
- $bazylia_g = 70g$ świeżej bazylii
- $parmezan_g = 30g$ parmezanu
- $oliwa_g = 50g$ oliwy

~
## Przepis
W moździerzu:
~- Zmiażdż $czosnek_ząbki$ (= $czosnek_g$) czosnku z $sól_g$ soli na jednolitą papkę.
~- Dodaj $orzechy_g$ orzechów nerkowca i zmiażdż aż będą tylko drobniuteńkie kawałki.
~- Stopniowo dodawaj i miażdż $bazylia_g$ bazylii.
~- Dodaj $parmezan_g$ parmezanu i $oliwa_g$ oliwy. Wymieszaj.
~- Smacznego!

Tak zrobione pesto przechowuj w lodówce max. kilka dni.
