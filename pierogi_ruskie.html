# Pierogi ruskie

Przepis na: $scale 60 / 60 hide_denom$ pierogów wykrawanych kółkiem o średnicy 8 cm.

Tryb prezentacji: $present$

~
## Składniki

### Ciasto
- $mąka = 550g$ mąki pszennej (najlepiej typ 450-500)
- $woda = 250ml$ gorącej wody (80-90 °C -- wystarczy poczekać 2-3 minuty po zagotowaniu)
- $ciasto_sól = 3g$ soli (= $ciasto_sól_łyżeczki = 0.5 łyżeczki$)
- $ciasto_masło = 30g$ masła (= $ciasto_masło_łyżki = 2 łyżki$)
- $żółtko = 1$ żółtko

### Farsz
- $ziemniaki = 500g$ obranych ziemniaków
- $czosnek = 3 ząbki$ czosnku
- $cebula = 2$ duże cebule
- $olej_ml = 55 ml$ oleju rzepakowego (= $olej_g = 50g$)
- $farsz_masło = 15g$ masła (= $farsz_masło_łyżki = 1 łyżka$)
- $twaróg = 500g$ twarogu tłustego (8%) lub półtłustego (4%)
- $farsz_sól = 9g$ soli (= $farsz_sól_łyżeczki = 1.5 łyżeczki$)
- $pieprz = 4g$ mielonego pieprzu czarnego (= $pieprz_łyżeczki = 1 łyżeczka$)
- $majeranek_łyżki = 1 łyżka$ suszonego majeranku (podbija smak i ułatwia trawienie tłustych potraf i ziemniaków (fasoli też btw.))

~

## Przepis
Najlepiej zacznij od gotowania ziemniaków. Ciasto przygotujesz gdy będą się gotować.

~
### Ciasto
- Bierzemy $woda$ gorącej wody (80-90 °C) i rozpuszczamy w niej $ciasto_sól$ soli.
~- Do miski przesiewamy $mąka$ mąki i wlewając partiami gorącą wodę mieszamy intensywnie masę łyżką przez 30-45 sekund. W ten sposób woda zaparza mąkę, przez co ciasto szybciej się wyrabia i mniej kurczy.
~- Rozpuszczamy $ciasto_masło$ masła (= $ciasto_masło_łyżki$) i dodajemy do ciasta razem z $żółtko$ żółtkiem.
~- Wyrabiamy ciasto ok. 6-8 minut ręcznie lub robotem.
~- Przykrywamy (najlepiej gorącą miską w której było, ewentualnie lekko wilgotną ściereczką) lub zawijamy w folię spożywczą i zostawiamy na 30 minut. Rozluźnia to gluten i ciasto lepiej się rozwałkowuje i mniej kurczy.

~
### Farsz
- Przygotować garnek do gotowania ziemniaków.
~- Obrać i odmierzyć $ziemniaki$ ziemniaków.
~- Obrać $czosnek$ czosnku i dodać do ziemniaków.
~- Posolić, zalać wodą.
~- Gotować ok. 30 minut.
~- Gdy ziemniaki się gotują, obrać i skroić w kostkę $cebula$ cebule.
~- Pokrojoną cebulę smażymy na $olej_ml$ oleju (= $olej_g$) i $farsz_masło$ masła (= $farsz_masło_łyżki$) długo i powoli, na wolnym ogniu, aż cebula zrobi się rumiano-brązowa.
~- Odcedzamy ziemniaki i chwilę studzimy, ale nie za długo.
~- Do miski na farsz przeciskamy ugotowane ziemniaki (bez czosnku) przez praskę (lub ugniatamy je jak praski nie mamy). Można też zmielić maszynką -- wtedy można też na zimno bo nie będzie trudniej.
~- Dodajemy usmażoną cebulę.
~- Dodajemy $twaróg$ twarogu.
~- Dodajemy $farsz_sól$ soli (= $farsz_sól_łyżeczki$).
~- Dodajemy $pieprz$ pieprzu (= $pieprz_łyżeczki$).
~- Rozcieramy i dodajemy $majeranek_łyżki$ suszonego majeranku.
~- Mieszamy do równomiernego połączenia.
~- Próbujemy czy nie trzeba doprawić. Farsz ma być ___lekko___ przesolony i przepieprzony -- ciasto wchłonie część tego smaku i ruskie mają być pieprzne :)
~- Wystudzić przed lepieniem pierogów -- inaczej będą pękać.

~
## Lepienie pierogów
- Przygotowujemy miejsce na sklejone pierogi -- blat lub deska lub ściereczka -- oprószone lekko mąką.
~- Ciasto partiami (lepiej mniejszymi) rozwałkowujemy na grubość 2 do 2.5 mm. Przy czym nie posypujemy góry ciasta przy wałkowaniu, ewentualnie minimalnie i tylko na początku. Dzięki temu pierogi będzie łatwo sklejać.
~- Wycinamy kółka 8 cm (lub innej wielkości).
~- Bierzemy kółko nakładamy farsz i zlepiamy. Jeżeli słabo się lepi można lekko zwilżyć krawędź wodą (palcem) przed sklejeniem. Można też zwilżyć całe rozwałkowane ciasto np. rozpylając wodę i lekko rozcierając ją po powierzchni.
~- Zlepione pierogi odkładamy na przygotowane miejsce i najlepiej pod ściereczkę -- żeby nie wysychały za bardzo.

~
## Mrożenie
Pierogi można zamrozić surowe lub po ugotowaniu.

~
## Gotowanie pierogów
- W dużym garnku zagotowujemy osoloną wodę i odrobinę oleju (parę łyżek).
~- Pierogi gotujemy partiami:
	- Wrzucamy do wrzątku.
	- Czekamy aż zaczną wypływać i po 2 minutach wyławiamy. Dłuższe gotowanie = oślizłe pierogi (bo skrobia się wypłukuje).
	- Wyłowione pierogi kładziemy tak żeby ostygły ale nie skleiły się za bardzo -- duży talerz jest lepszy od miski gdzie leżałyby jeden na drugim.
	- Można jeszcze próbować hartować żeby się mniej kleiły tj. wrzucać na 30-60s do zimnej wody (im zimniejsza tym lepsza), ale da się i bez tego.
~- Jak pierogi lekko przestygną to najlepiej jest je omaścić masłem żeby nie skleiły się przy przechowywaniu.

~
Smacznego!
